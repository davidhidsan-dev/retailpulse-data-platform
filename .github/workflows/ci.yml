name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit locked Python dependencies
        run: python -m pip_audit -r requirements.txt

  airflow-image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build --file Dockerfile.airflow --tag retailpulse-airflow:ci .

      - name: Audit Airflow base environment
        run: |
          docker run --rm --entrypoint bash retailpulse-airflow:ci -lc '
            set -e
            airflow_site_packages="$(python -c "import site; print(site.getusersitepackages())")"
            python -m venv /tmp/airflow-audit
            /tmp/airflow-audit/bin/python -m pip install --quiet pip-audit==2.10.1
            /tmp/airflow-audit/bin/python -m pip_audit \
              --path "${airflow_site_packages}"
          '

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

  postgres-integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: retailpulse_user
      POSTGRES_PASSWORD: retailpulse_password
      POSTGRES_DB: retailpulse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DBT_SCHEMA: analytics
      RUN_POSTGRES_INTEGRATION: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retailpulse_user
          POSTGRES_PASSWORD: retailpulse_password
          POSTGRES_DB: retailpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retailpulse_user -d retailpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run PostgreSQL integration test
        run: pytest -q tests/integration/test_postgres_pipeline.py

      - name: Build and test dbt models
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          dbt build --project-dir dbt --profiles-dir dbt
